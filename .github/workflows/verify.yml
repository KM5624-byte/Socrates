name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@10.34.8
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - run: uv sync --locked --group ingest --group research
      - run: pnpm install --frozen-lockfile
      - run: uv run --locked ruff check services/api pipelines research tests
      - run: uv run --locked ruff format --check services/api pipelines research tests
      - run: uv run --locked --group ingest --group research pytest
      - run: pnpm api:generate && git diff --exit-code -- packages/api-client/schema.d.ts
      - run: pnpm check && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - run: uv run --locked --group research bash scripts/reproduce-notebook
      - run: docker build -f infrastructure/docker/api.Dockerfile -t aileo-api .
      - run: docker build -f infrastructure/docker/research.Dockerfile -t aileo-research .
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@10.34.8
      - run: pnpm audit --audit-level high
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt > /tmp/aileo-requirements.txt
      - run: uvx pip-audit --requirement /tmp/aileo-requirements.txt
